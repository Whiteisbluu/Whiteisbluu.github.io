<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      position: relative;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      transition: background-color 0.05s linear;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    .part {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .glass {
      width: min(420px, 90vw);
      padding: 1.6rem 2rem;
      border-radius: 28px;
      text-align: left;
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 8px rgba(255, 255, 255, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      margin-bottom: 0.5rem;
    }

    p.info {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="part" id="white">
    <div class="glass">
      <h1>white</h1>
      <p class="info">test</p>
    </div>
  </div>

  <div class="part" id="karina">
    <div class="glass">
      <h1>KARINA</h1>
      <p class="info">test</p>
    </div>
  </div>

  <div class="part" id="winter">
    <div class="glass">
      <h1>WINTER</h1>
      <p class="info">test</p>
    </div>
  </div>

  <div class="part" id="giselle">
    <div class="glass">
      <h1>GISELLE</h1>
      <p class="info">test</p>
    </div>
  </div>

  <div class="part" id="ningning">
    <div class="glass">
      <h1>NINGNING</h1>
      <p class="info">test</p>
    </div>
  </div>

  <script>
    const body = document.body;
    const headings = document.querySelectorAll('h1, p.info');
    let ticking = false;

    function update() {
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const t = maxScroll > 0 ? window.scrollY / maxScroll : 0;

      const wave = t < 0.5 ? t * 2 : (1 - t) * 2;
      const bg = Math.round(wave * 255);

      const k = 0.08;
      const lightness = 1 / (1 + Math.exp(-k * (bg - 127.5)));
      const fg = Math.round(255 * (1 - lightness));
      const isLight = bg > 128;

      body.style.backgroundColor = `rgb(${bg}, ${bg}, ${bg})`;

      headings.forEach(h => {
        h.style.color = `rgb(${fg}, ${fg}, ${fg})`;
        h.style.textShadow = isLight
          ? '0 1px 2px rgba(255,255,255,0.3)'
          : '0 1px 2px rgba(0,0,0,0.3)';
      });

      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    });

    update();
  </script>

</body>
</html>
