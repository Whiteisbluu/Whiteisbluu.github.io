<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@Whiteisbluu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      position: relative;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('IMG_0022.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
      filter: brightness(0.85) contrast(1.1);
      z-index: -2;
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .part {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .glass {
      width: min(420px, 90vw);
      padding: 1.6rem 2rem;
      border-radius: 28px;
      text-align: left;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 8px rgba(255, 255, 255, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      margin-bottom: 0.5rem;
    }

    #about-me {
      position: relative;
    }

    .open-modal-btn {
      margin-top: 0.9rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 100px;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .open-modal-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .expand-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      margin-top: 0;
      padding-top: 0;
      border-top: 1px solid rgba(255, 255, 255, 0);
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.4s ease, padding-top 0.4s ease, border-color 0.4s ease;
    }

    .expand-panel.open {
      max-height: 200px;
      opacity: 1;
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    p.info {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      opacity: 0.95;
    }

    p.info a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      transition: border-color 0.2s;
    }

    p.info a:hover {
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <canvas id="stars"></canvas>

  <div class="part" id="about-me">
    <div class="glass">
      <h1>Hello!</h1>
      <p class="info">Digital Artist, Graphic Artist, Programmer.</p>
      <button class="open-modal-btn" onclick="document.getElementById('inline-panel').classList.toggle('open')">blank</button>
      <div class="expand-panel" id="inline-panel">
        <p class="info">blank</p>
      </div>
    </div>
  </div>

  <div class="part" id="socials">
    <div class="glass">
      <h1>Socials</h1>
      <p class="info">
        <a href="https://www.instagram.com/khennjhay_/">Instagram</a><br>
        <a href="#">Carrd</a>
      </p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      const count = Math.floor((canvas.width * canvas.height) / 8000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.3 + 0.3,
        speed: Math.random() * 0.15 + 0.02,
        twinkleSpeed: Math.random() * 0.05 + 0.01,
        twinklePhase: Math.random() * Math.PI * 2
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
        star.twinklePhase += star.twinkleSpeed;
        const raw = Math.sin(star.twinklePhase);
        const opacity = Math.max(0, Math.pow(raw, 3));

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    draw();
  </script>

</body>
</html>
