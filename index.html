<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      position: relative;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    .part {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .glass {
      width: min(420px, 90vw);
      padding: 1.6rem 2rem;
      border-radius: 28px;
      text-align: left;
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 8px rgba(255, 255, 255, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      margin-bottom: 0.5rem;
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    p.info {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      opacity: 0.85;
    }
    p.info a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    }

    p.info a:hover {
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="part" id="about-me">
    <div class="glass">
      <h1>About Me</h1>
      <p class="info">I'm an artist, drawing for 6 years, and also a graphic designer.</p>
    </div>
  </div>

  <div class="part" id="socials">
    <div class="glass">
      <h1>Socials</h1>
      <p class="info">
        <a href="mailto:you@example.com">Email</a><br>
        <a href="#">Instagram</a><br>
        <a href="#">Behance</a>
      </p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      const count = Math.floor((canvas.width * canvas.height) / 8000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.3 + 0.3,
        speed: Math.random() * 0.15 + 0.02,
        twinkleSpeed: Math.random() * 0.05 + 0.01,
        twinklePhase: Math.random() * Math.PI * 2
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
        star.twinklePhase += star.twinkleSpeed;
        const raw = Math.sin(star.twinklePhase);
        const opacity = Math.max(0, Math.pow(raw, 3));

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    draw();
  </script>

</body>
</html>
