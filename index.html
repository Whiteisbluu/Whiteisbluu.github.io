<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com;
    frame-src https://www.youtube.com;
    child-src https://www.youtube.com;
    img-src 'self' data: https://i.ytimg.com;
    style-src 'self' 'unsafe-inline';
  ">

  <title>@Whiteisbluu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      position: relative;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      padding: 0 5vw;
    }

    .loader-text {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #ffffff;
    }

    .loader-text span {
      display: inline-block;
      opacity: 0;
      transform: translateY(24px) scale(0.9);
      animation: letterIn 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    .loader-text span:nth-child(1) { animation-delay: 0.15s; }
    .loader-text span:nth-child(2) { animation-delay: 0.25s; }
    .loader-text span:nth-child(3) { animation-delay: 0.35s; }
    .loader-text span:nth-child(4) { animation-delay: 0.45s; }
    .loader-text span:nth-child(5) { animation-delay: 0.55s; }
    .loader-text span:nth-child(6) { animation-delay: 0.65s; }
    .loader-text span:nth-child(7) { animation-delay: 0.75s; }
    .loader-text span:nth-child(8) { animation-delay: 0.85s; }

    @keyframes letterIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .loader-subtext {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      animation: subtextIn 1s ease 1.4s forwards, subtextBreathe 2.5s ease-in-out 2.4s infinite;
    }

    @keyframes subtextIn {
      to { opacity: 0.6; }
    }

    @keyframes subtextBreathe {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.25; }
    }

    button {
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    .music-toggle {
      position: fixed;
      bottom: 2rem;
      bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
      right: 2rem;
      right: calc(2rem + env(safe-area-inset-right, 0px));
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 60;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }

    .music-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.08);
    }

    .music-toggle svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .music-toggle .icon-pause { display: none; }
    .music-toggle.playing .icon-play { display: none; }
    .music-toggle.playing .icon-pause { display: block; }

    .music-toggle.playing {
      animation: buttonPulse 2s infinite;
      border-color: rgba(255, 255, 255, 0.5);
    }

    @keyframes buttonPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
      70% { box-shadow: 0 0 0 16px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    .scroll-indicator {
      position: fixed;
      right: 2rem;
      right: calc(2rem + env(safe-area-inset-right, 0px));
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
    }

    .indicator-track {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 8px;
    }

    .indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: background 0.3s ease;
    }

    .indicator-dot:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .indicator-thumb {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #ffffff;
      z-index: 1;
      transition:
        transform 0.28s cubic-bezier(0.65, 0, 0.35, 1),
        height 0.28s cubic-bezier(0.65, 0, 0.35, 1);
    }

    #ytplayer {
      position: fixed;
      bottom: -500px;
      right: -500px;
      width: 500px;
      height: 500px;
      z-index: -999;
      pointer-events: none;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-image: url('IMG_0022.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
      filter: brightness(0.85) contrast(1.1);
      -webkit-filter: brightness(0.85) contrast(1.1);
      z-index: -2;
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .part {
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
    }

    .glass {
      width: min(420px, 90vw);
      max-height: 84vh;
      max-height: 84dvh;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 1.6rem 2rem;
      border-radius: 28px;
      text-align: left;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 8px rgba(255, 255, 255, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .glass::-webkit-scrollbar {
      display: none;
    }

    .name-title {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      margin-bottom: 0.5rem;
    }

    #about-me {
      position: relative;
    }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.9rem;
      flex-wrap: wrap;
    }

    .open-modal-btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 100px;
      padding: 0.5rem 1.2rem;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }

    .open-modal-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .open-modal-btn:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.25);
    }

    .expand-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition:
        grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        margin-top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        padding-top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      padding-top: 0;
      border-top: 1px solid rgba(255, 255, 255, 0);
    }

    .expand-panel > .panel-content {
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease 0.15s;
    }

    .expand-panel.open {
      grid-template-rows: 1fr;
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top-color: rgba(255, 255, 255, 0.2);
    }

    .expand-panel.open > .panel-content {
      opacity: 1;
    }

    p.info {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      opacity: 0.95;
    }

    .social-icons {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .social-icons a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .social-icons a:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .social-icons a:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.3);
    }

    #image {
      justify-content: center;
      padding-left: 0;
    }

    .image-container {
      width: min(640px, 92vw);
    }

    .image-title {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
    }

    .image-card {
      aspect-ratio: 4 / 3;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background-color: transparent;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.4s ease, box-shadow 0.4s ease;
    }

    @supports not (aspect-ratio: 4 / 3) {
      .image-card {
        height: 160px;
      }
    }

    .image-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .image-card span {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 900px) {
      .part {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
        padding: 0 5vw;
      }
    }

    @media (max-width: 380px) {
      .glass {
        padding: 1.2rem 1.4rem;
        border-radius: 22px;
      }
      .social-icons a {
        width: 38px;
        height: 38px;
      }
      .social-icons {
        gap: 0.5rem;
      }
    }

    @media (max-height: 700px) {
      .glass {
        padding: 1.2rem 1.5rem;
      }
      .name-title {
        margin-bottom: 0.2rem;
      }
      .image-title {
        margin-bottom: 0.9rem;
      }
      .image-grid {
        gap: 0.8rem;
      }
      .image-card {
        padding: 0.7rem;
        border-radius: 16px;
      }
      .image-card span {
        font-size: 0.75rem;
      }
    }

    @media (max-height: 560px) {
      .image-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .image-card {
        padding: 0.5rem;
      }
      .image-title {
        margin-bottom: 0.6rem;
      }
    }

    @media (max-width: 768px) {
      .scroll-indicator {
        right: 1rem;
        right: calc(1rem + env(safe-area-inset-right, 0px));
      }
      .music-toggle {
        bottom: 1.5rem;
        bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        right: 1.5rem;
        right: calc(1.5rem + env(safe-area-inset-right, 0px));
        width: 50px;
        height: 50px;
      }
      .music-toggle svg {
        width: 20px;
        height: 20px;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .music-toggle:hover,
      .open-modal-btn:hover,
      .social-icons a:hover,
      .indicator-dot:hover {
        transform: none;
        box-shadow: none;
      }
      .music-toggle:active {
        transform: scale(0.94);
      }
      .image-card:active {
        transform: scale(0.98);
        border-color: rgba(255, 255, 255, 0.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

          <span>IMG 02</span>
        </div>
        <div class="image-card" style="background-image: url('art3.jpg');">
          <span>IMG 03</span>
        </div>
        <div class="image-card" style="background-image: url('art4.jpg');">
          <span>IMG 04</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    function togglePanel(targetId) {
      const panels = document.querySelectorAll('.expand-panel');
      panels.forEach(panel => {
        if (panel.id === targetId) {
          panel.classList.toggle('open');
        } else {
          panel.classList.remove('open');
        }
      });
    }

    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let lastTime = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      const count = Math.floor((canvas.width * canvas.height) / 8000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.3 + 0.3,
        speed: Math.random() * 0.15 + 0.02,
        twinkleSpeed: Math.random() * 0.03 + 0.01,
        twinklePhase: Math.random() * Math.PI * 2
      }));
    }

    function draw(currentTime) {
      if (!lastTime) lastTime = currentTime;
      const dtFactor = (currentTime - lastTime) / 16.67;
      lastTime = currentTime;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.y += star.speed * dtFactor;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
        star.twinklePhase += star.twinkleSpeed * dtFactor;
        const raw = Math.sin(star.twinklePhase);
        const opacity = Math.max(0, raw) * 0.8 + 0.2;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    const musicToggle = document.getElementById('musicToggle');
    const loader = document.getElementById('loader');
    let ytPlayer;
    let musicPlaying = false;
    let userClickedEnter = false;

    const videoIds = ['LBhcqYqeu0U', 'fyk6vjwI3wc'];
    const startVideo = videoIds[Math.floor(Math.random() * videoIds.length)];

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytplayer', {
        width: '500',
        height: '500',
        videoId: startVideo,
        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1
        },
        events: {
          onReady: function(event) {
            event.target.setVolume(50);
            if (userClickedEnter) {
              event.target.playVideo();
            }
          },
          onStateChange: function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              const nextVideo = videoIds[Math.floor(Math.random() * videoIds.length)];
              ytPlayer.loadVideoById(nextVideo);
            }
          }
        }
      });
    }

    musicToggle.addEventListener('click', () => {
      musicPlaying = !musicPlaying;
      musicToggle.classList.toggle('playing', musicPlaying);
      
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        if (musicPlaying) {
          ytPlayer.playVideo();
        } else {
          ytPlayer.pauseVideo();
        }
      }
    });

    loader.addEventListener('click', () => {
      loader.classList.add('hidden');
      userClickedEnter = true;
      musicPlaying = true;
      musicToggle.classList.add('playing');
      
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        ytPlayer.playVideo();
      }
    });

    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    requestAnimationFrame(draw);

    const thumb = document.getElementById('indicatorThumb');
    const dots = document.querySelectorAll('.indicator-dot');
    const sections = document.querySelectorAll('.part');
    let currentSection = 0;
    let thumbTimeout;

    function moveThumb(index) {
      if (index === currentSection) return;
      const step = 34;
      const goingDown = index > currentSection;

      clearTimeout(thumbTimeout);

      if (goingDown) {
        thumb.style.height = '34px';
        thumbTimeout = setTimeout(() => {
          thumb.style.transform = `translateY(${index * step}px)`;
          thumb.style.height = '10px';
        }, 180);
      } else {
        thumb.style.transform = `translateY(${index * step}px)`;
        thumb.style.height = '34px';
        thumbTimeout = setTimeout(() => {
          thumb.style.height = '10px';
        }, 180);
      }
      currentSection = index;
    }

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const targetId = dot.getAttribute('data-target');
        const targetSection = document.getElementById(targetId);
        if (targetSection) {
          targetSection.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    if ('IntersectionObserver' in window) {
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.5
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const currentId = entry.target.id;
            const index = Array.from(sections).findIndex(s => s.id === currentId);
            if (index !== -1) {
              moveThumb(index);
            }
          }
        });
      }, observerOptions);

      sections.forEach(section => {
        observer.observe(section);
      });
    }
  </script>

</body>
