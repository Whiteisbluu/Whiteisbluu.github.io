<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@Whiteisbluu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      overscroll-behavior: none;
    }

    body {
      position: relative;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-text {
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.25em;
      color: #ffffff;
      animation: loaderPulse 1.6s ease-in-out infinite;
    }

    @keyframes loaderPulse {
      0%, 100% { opacity: 0.25; text-shadow: 0 0 8px rgba(255, 255, 255, 0.15); }
      50% { opacity: 1; text-shadow: 0 0 28px rgba(255, 255, 255, 0.8); }
    }

    .music-toggle {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      z-index: 50;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .music-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .music-toggle .wave1,
    .music-toggle .wave2 {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .music-toggle.playing .wave1 { opacity: 1; }
    .music-toggle.playing .wave2 { opacity: 0.55; }

    #ytplayer {
      position: fixed;
      bottom: -500px;
      right: -500px;
      width: 500px;
      height: 500px;
      z-index: -999;
      pointer-events: none;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('IMG_0022.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
      filter: brightness(0.85) contrast(1.1);
      z-index: -2;
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .part {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .glass {
      width: min(420px, 90vw);
      padding: 1.6rem 2rem;
      border-radius: 28px;
      text-align: left;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 8px rgba(255, 255, 255, 0.05),
        0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      margin-bottom: 0.5rem;
    }

    #about-me {
      position: relative;
    }

    .open-modal-btn {
      margin-top: 0.9rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 100px;
      padding: 0.5rem 1.2rem;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .open-modal-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .open-modal-btn:active {
      transform: translateY(0);
    }

    .expand-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition:
        grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        margin-top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        padding-top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      padding-top: 0;
      border-top: 1px solid rgba(255, 255, 255, 0);
    }

    .expand-panel > .panel-content {
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease 0.15s;
    }

    .expand-panel.open {
      grid-template-rows: 1fr;
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top-color: rgba(255, 255, 255, 0.2);
    }

    .expand-panel.open > .panel-content {
      opacity: 1;
    }

    p.info {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      opacity: 0.95;
    }

    p.info a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      transition: border-color 0.2s;
    }

    p.info a:hover {
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-text">@Whiteisbluu</div>
  </div>

  <div id="ytplayer"></div>

  <div class="bg-image"></div>
  <canvas id="stars"></canvas>

  <button class="music-toggle" id="musicToggle" aria-label="Toggle ambient music">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>
      <path class="wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path class="wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>

  <div class="part" id="about-me">
    <div class="glass">
      <h1>Hello!</h1>
      <p class="info">Digital Artist, Graphic Artist, Programmer.</p>
      <button class="open-modal-btn" onclick="document.getElementById('inline-panel').classList.toggle('open')">blank</button>
      <div class="expand-panel" id="inline-panel">
        <div class="panel-content">
          <p class="info">blank</p>
        </div>
      </div>
    </div>
  </div>

  <div class="part" id="socials">
    <div class="glass">
      <h1>Socials</h1>
      <p class="info">
        <a href="https://www.instagram.com/khennjhay_/">Instagram</a><br>
        <a href="#">Carrd</a>
      </p>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let lastTime = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      const count = Math.floor((canvas.width * canvas.height) / 8000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.3 + 0.3,
        speed: Math.random() * 0.15 + 0.02,
        twinkleSpeed: Math.random() * 0.03 + 0.01,
        twinklePhase: Math.random() * Math.PI * 2
      }));
    }

    function draw(currentTime) {
      if (!lastTime) lastTime = currentTime;
      const dtFactor = (currentTime - lastTime) / 16.67;
      lastTime = currentTime;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.y += star.speed * dtFactor;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
        star.twinklePhase += star.twinkleSpeed * dtFactor;
        const raw = Math.sin(star.twinklePhase);
        const opacity = Math.max(0, raw) * 0.8 + 0.2;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    const musicToggle = document.getElementById('musicToggle');
    let ytPlayer;
    let musicPlaying = false;
    const videoId = 'LBhcqYqeu0U';

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytplayer', {
        width: '500',
        height: '500',
        videoId: videoId,
        playerVars: {
          autoplay: 0,
          controls: 0,
          loop: 1,
          playlist: videoId,
          playsinline: 1
        },
        events: {
          onReady: function(event) {
            event.target.setVolume(50);
          }
        }
      });
    }

    musicToggle.addEventListener('click', () => {
      musicPlaying = !musicPlaying;
      musicToggle.classList.toggle('playing', musicPlaying);
      
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        if (musicPlaying) {
          ytPlayer.playVideo();
        } else {
          ytPlayer.pauseVideo();
        }
      }
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
      }, 1200);
    });

    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    requestAnimationFrame(draw);
  </script>

</body>
</html>
